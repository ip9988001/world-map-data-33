name: ci-smoke
# 改动自检：任何 push 到 collect/ 或 scripts/ 的改动，先单层跑 3 条记录，过不了就别放量。
on:
  push:
    paths: ["collect/**", "scripts/**", "survey/ng911/scripts/**"]
  workflow_dispatch:
permissions: { contents: read }
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 语法检查
        run: python3 -m py_compile collect/*.py scripts/*.py survey/ng911/scripts/*.py
      - name: 单层试采（按配置逐个试，任意一层有数据即通过）
        run: |
          python3 - <<'PY'
          import json, urllib.request
          cfg = sorted(json.load(open("collect/pilot_layers.json")), key=lambda x: (x.get("expect") or 10**9))
          tried = []
          for c in cfg[:5]:
              try:
                  u = c["url"].rstrip("/") + "/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=3&f=json"
                  d = json.load(urllib.request.urlopen(u, timeout=40))
                  n = len(d.get("features") or [])
              except Exception as e:
                  n = 0
                  tried.append((c["id"], "ERR", str(e)[:60]))
                  continue
              tried.append((c["id"], n))
              if n > 0:
                  print("PASS layer:", c["id"], "rows:", n)
                  print("tried:", tried)
                  raise SystemExit(0)
          print("tried:", tried)
          raise SystemExit("试采全部拿不到数据，链路有问题")
          PY
