name: collect-full

# 全量补采 · 四阶段滚（step04b → 05b → 07b，**到此为止**），全部在 runner 上跑。
#
# ★ 停车线（2026-10-30 定案，改之前先看 collect/chain_policy.py）：
#   只把点类 04b → 05b → 07b 采完就停。**07b 跑完不许自动接 10b（宗地 8,116 层 / 20~85 GB）**，
#   08（去重）/ 09（增量）/ 10b / 几何一律等口令。
#   接续表与允许清单的唯一真值是 `collect/chain_policy.py`（有单测）：
#     ① 07b 的 NEXT 为空 ② 允许清单只放 05b / 07b ③ 接续出去的子 run 一律 chain=0（单跳，不级联）
#   另外 10b 派发前还有 `authorize_heavy=1` 硬闸门。
#
# 为什么是「分片」而不是「一层一个 matrix job」：GitHub matrix 硬上限 256 job/run，
# 而本仓剩 272/2,770/667/3,898 层。所以 matrix 的单元是**片**：
#   step04b 20 层/片（大层慢）、step05b/07b/10b 200 层/片。
# 每片一个 job：timeout 350 分钟、fail-fast: false、顺序跑片内层、逐层落账。
# 断点续跑：已采层靠 done_layers（release tag + 本机 audit）判 skipped_done；pilot 自己的
# checkpoint 在 Release 上，重跑只补缺口。
# 收敛：本阶段 failed==0 → 自动 dispatch 下一阶段；否则停在这里等人看账本。
on:
  workflow_dispatch:
    inputs:
      stage:        { description: "04b / 05b / 07b / 10b（10b 需同时给 authorize_heavy=1）", default: "04b" }
      size:         { description: "每片层数（0=按阶段默认）", default: "0" }
      workers:      { description: "层内并发线程", default: "4" }
      unit_rows:    { description: "单元行数（0=按 steps.json）", default: "0" }
      max_shards:   { description: "最多跑几片（0=全部，灰度用）", default: "0" }
      # ★ 默认 0（2026-10-30 改）：不主动接续。要接续必须显式 -f chain=1。
      #   接续出去的子 run 只带 chain=0（单跳），见 collect/chain_policy.py。
      chain:        { description: "1=本阶段全绿后接续下一阶段（子 run 强制 chain=0，仅一跳）", default: "0" }
      # ★ 重阶段闸门：10b（宗地 8,116 层 / 20~85 GB）默认关闭，必须显式 -f authorize_heavy=1 才可派。
      authorize_heavy: { description: "1=授权重阶段（10b 宗地）；其余阶段忽略", default: "0" }
      # ★ cancelled 片续跑入口：逗号分隔的层 id。这些层即使 done_layers 判「完成」也强制重跑。
      #   为什么需要：cancelled 片里的层会留下「单元标完成、产物没上传」或「计划期口径差」
      #   的半截状态，done_layers（只看 tag+checkpoint）看不见 → 不定点重跑就永久缺口。
      force_layers: { description: "强制重跑的层 id（逗号分隔，cancelled 片续跑用）", default: "" }
      # ★ 单层墙钟上限（分钟）。默认 60：4 层/片 × 60 < 350 分钟上限，挂死一层不拖垮整片。
      #   大层（如 NAD 9,790 万行）分轮续跑：一轮 60 分钟只推进一部分，checkpoint 接着跑。
      layer_timeout: { description: "单层墙钟上限（分钟，0=默认 60）", default: "0" }
      # ★ 账本重建入口：只读 Release 资产，不采一行数据。
      #   用途：某几片的账本因文件名不匹配而静默落空（已由 98bd461 修好，但那批 run
      #   用自己 checkout 的 SHA，补不回来）→ 事后以资产为唯一真值重建账本 + 收官文档。
      rebuild_ledger: { description: "1=只重建账本（从 Release 资产），不采数", default: "0" }
      plan_run_id:    { description: "重建时从哪个 run 取 plan-<stage> 产物（空=本 run 里现算）", default: "" }

permissions:
  contents: write
  actions: write

concurrency:
  group: collect-full-${{ inputs.stage }}
  cancel-in-progress: false

env:
  SIZE_DEFAULT_04B: "20"
  SIZE_DEFAULT_05B: "200"
  SIZE_DEFAULT_07B: "670"
  SIZE_DEFAULT_10B: "200"

jobs:
  plan:
    if: inputs.rebuild_ledger != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      shards: ${{ steps.p.outputs.shards }}
      size:   ${{ steps.p.outputs.size }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet pyyaml
      # ★ 派单前核验（2026-10-31 立规）：**没有 preflight 输出的派单，视为无效派单**。
      #   只读：不采集、不派发、不改账本（上游只发 returnCountOnly 计数请求）。
      #   18 项分五组（队列/并发、代码版本、账本基线、数据重叠、上游可用性），任一 FAIL → 本 job 直接红，
      #   shard 一个都起不来。判据与处置见 docs/PREFLIGHT-GATE.md。
      - name: 派单前核验（preflight gate）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORIZE_HEAVY: ${{ inputs.authorize_heavy }}
        run: |
          set -euo pipefail
          ARG=""
          [ "$AUTHORIZE_HEAVY" = "1" ] && ARG="--authorize-heavy"
          python3 collect/preflight_dispatch.py \
            --stage "${{ inputs.stage }}" \
            --force-layers "${{ inputs.force_layers }}" \
            --size "${{ inputs.size }}" \
            --max-shards "${{ inputs.max_shards }}" \
            --ref "${{ github.ref_name }}" $ARG | tee /tmp/preflight.log
          { echo "### 派单前核验（${{ inputs.stage }}）"; echo '```'
            cat /tmp/preflight.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # ★ 重阶段闸门（2026-10-30 定案）：10b = 宗地 8,116 层 / 20~85 GB，属于「等口号」范围。
      #   不加这一步，任何人 `-f stage=10b` 就能把它放出去；加了之后必须同时给 authorize_heavy=1。
      - name: 重阶段闸门（10b 默认关闭）
        run: |
          set -euo pipefail
          if [ "${{ inputs.stage }}" = "10b" ] && [ "${{ inputs.authorize_heavy }}" != "1" ]; then
            echo "::error::10b（宗地 8,116 层 / 20~85 GB）默认关闭：须显式 -f authorize_heavy=1 才可派。08/09/10b/几何一律等口号。"
            exit 1
          fi
          python3 collect/chain_policy.py --all --dry-run   # 顺带自证策略模块可导入、表未变
      - id: p
        name: 算待采层 + 切片
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}
          FORCE: ${{ inputs.force_layers }}
        run: |
          set -euo pipefail
          mkdir -p collect/ledger
          case "$STAGE" in
            04b) DEF=$SIZE_DEFAULT_04B ;; 05b) DEF=$SIZE_DEFAULT_05B ;;
            07b) DEF=$SIZE_DEFAULT_07B ;; 10b) DEF=$SIZE_DEFAULT_10B ;;
            *) echo "::error::未知 stage $STAGE"; exit 1 ;;
          esac
          SIZE="${{ inputs.size }}"; [ "$SIZE" = "0" ] && SIZE="$DEF"
          python3 collect/run_step_${STAGE}.py --validate
          python3 collect/full_plan.py --stage "$STAGE" --size "$SIZE" \
            ${FORCE:+--force-layers "$FORCE"} \
            --out "collect/ledger/${STAGE}_plan.json" | tee /tmp/plan.log
          MAX="${{ inputs.max_shards }}"
          # ★ max_shards 截断必须喊出来（W33-036，2026-10-31）：旧实现是这两行 shell
          #   `if [ "$MAX" != "0" ] && [ "$N" -gt "$MAX" ]; then N="$MAX"; fi` —— 静默砍尾片，
          #   run 41126178216 的 3 片被砍成 2 片、shard 2 的 6 层**从 run 里消失**，账本无痕，
          #   事后只能当成「没采到」。现在改 plan_truncate.py：打 ::warning:: + 完整列出被砍
          #   分片号与层 id，并写进 plan 的 shards_dropped[] / plan_truncated{}（收口文档单列）。
          python3 collect/plan_truncate.py --plan "collect/ledger/${STAGE}_plan.json" \
            --max-shards "$MAX" --github-output "$GITHUB_OUTPUT" | tee /tmp/truncate.log
          N=$(python3 -c "import json;d=json.load(open('collect/ledger/${STAGE}_plan.json'));t=d.get('plan_truncated');print(t['actual_shards'] if t else d['shards_n'])")
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          { echo "### $STAGE 计划"; echo '```'; cat /tmp/plan.log; echo '```'
            echo "本次跑 **$N** 片（每片 $SIZE 层）"
            if grep -q '::warning::' /tmp/truncate.log; then
              echo ""
              echo "**⚠️ max_shards=$MAX 截断：下列分片/层本轮注定不会跑（不是「没采到」）**"
              echo '```'
              grep '被砍的分片' /tmp/truncate.log | sed 's/^::warning:://'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # ★ 计划必须进 git：2026-10-30 起 GitHub Actions 账号的 artifact **下载**受 egress 配额限流，
      #   14 片里有 9~14 片在「取计划」这一步就红了（采集一行没跑）。git 不受这个配额影响。
      - name: 计划提交到 main（供各片直接 git 取，不依赖 artifact 下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          cp "collect/ledger/${STAGE}_plan.json" /tmp/plan.json
          for i in $(seq 1 6); do
            git fetch -q origin main || true
            git checkout -qf -B main origin/main
            cp /tmp/plan.json "collect/ledger/${STAGE}_plan.json"
            git add -f "collect/ledger/${STAGE}_plan.json"
            # 派单前的 preflight 产物一起进 git：审计「这次派单核验过什么」
            git add -f analysis/preflight-${STAGE}-*.json analysis/rows-baseline-${STAGE}-*.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "计划无变化"; exit 0; fi
            git -c user.name=collect-bot -c user.email=bot@users.noreply.github.com \
                commit -q -m "collect: ${STAGE} 计划（run ${{ github.run_id }}）"
            if git push -q origin HEAD:main; then echo "✅ 计划已进 main"; exit 0; fi
            sleep $((i * 3))
          done
          echo "::warning::计划提交失败，片端将回退到 artifact 下载"
      - uses: actions/upload-artifact@v4
        with:
          name: plan-${{ inputs.stage }}
          path: collect/ledger/${{ inputs.stage }}_plan.json
          retention-days: 30
          if-no-files-found: warn

  shard:
    needs: plan
    if: inputs.rebuild_ledger != '1' && needs.plan.outputs.shards != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet pyyaml
      # ★ 2026-10-30 事故（run 41120626718）：14 片里 9 片在**取计划**这一步就红了 ——
      #   `Artifact download failed after 5 retries`（8 路并行下同一 artifact 被反复拉，限流）。
      #   采集一行没跑、片却判红 → 整轮白跑。改用 gh CLI 自带重试，失败重拉。
      - name: 取计划（优先 git，artifact 只当兜底）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F="collect/ledger/${{ inputs.stage }}_plan.json"
          for i in 1 2 3 4; do
            git fetch -q origin main || true
            git checkout -q origin/main -- "$F" 2>/dev/null && [ -s "$F" ] && { echo "✅ 计划取自 main（第 $i 次）"; exit 0; }
            sleep $((i * 4))
          done
          echo "⚠️ main 上没有计划，回退 artifact 下载"
          for i in 1 2 3 4 5; do
            if gh run download "$GITHUB_RUN_ID" -n "plan-${{ inputs.stage }}" -D collect/ledger; then
              echo "✅ 计划取自 artifact（第 $i 次）"; exit 0
            fi
            echo "⚠️ 第 $i 次 artifact 下载失败（egress 限流），重试…"; sleep $((i * 5))
          done
          echo "::error::取不到计划（git + artifact 都失败）"; exit 1
      - name: 采片 ${{ matrix.shard }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PILOT_HEARTBEAT_PUSH: "1"
          FORCE: ${{ inputs.force_layers }}
          LT: ${{ inputs.layer_timeout }}
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          # 0 = 用脚本默认（60 分钟）。注意：不能写成 `[ ... ] && LT=""`，
          # 条件为假时整条命令返回值非 0，在 set -e 下会直接退出（踩过）。
          if [ "${LT}" = "0" ]; then LT=""; fi
          # tag 与 steps.json 一致（collect-step04-<layer> 等），换 run 能续跑
          TAGPFX=$(python3 -c "import json;print(json.load(open('collect/ledger/${STAGE}_plan.json'))['tag'].replace('{layer}',''))")
          echo "TAG 前缀：$TAGPFX"
          python3 collect/full_shard.py --stage "$STAGE" --shard ${{ matrix.shard }} \
            --plan "collect/ledger/${STAGE}_plan.json" \
            --workers "${{ inputs.workers }}" --unit-rows "${{ inputs.unit_rows }}" \
            ${FORCE:+--force-layers "$FORCE"} \
            ${LT:+--layer-timeout "$LT"} \
            --tag-prefix "$TAGPFX"
      - name: 提交本片账本（只动自己那一个文件，用重置到 main 的方式避免并发冲突）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"; ID=$(printf "%02d" ${{ matrix.shard }})
          F="collect/ledger/${STAGE}_shard${ID}.json"
          # 兜底：账本实际文件名以 stage 前缀为准；找不到就按 *_**_shardNN.json 兜一次，
          # 避免「跑完 12 小时、账本静默落空」（2026-10-30 实测过这个坑）
          [ -f "$F" ] || F=$(ls "collect/ledger/"*_shard"${ID}".json 2>/dev/null | head -1)
          [ -n "${F:-}" ] && [ -f "$F" ] || { echo "⚠️ 本片没产出账本（片内 0 层或早退）"; exit 0; }
          cp "$F" /tmp/led.json
          for i in $(seq 1 6); do
            git fetch -q origin main || true
            # ★ 必须 -f：采采过程会在工作区留下未提交的产物（reports/*.json 等），
            #   裸 checkout 直接被 Git 拒掉 → 整片红（2026-10-30 实测 shard 4/8 就是这样红的，
            #   而账本本身早已正确生成、artifact 也传了）
            git checkout -qf -B main origin/main
            mkdir -p collect/ledger
            cp /tmp/led.json "$F"
            git add -f "$F"
            git -c user.name=collect-bot -c user.email=bot@users.noreply.github.com \
                commit -q -m "collect: ${STAGE} 片 ${ID} 账本" || true
            if git push -q origin HEAD:main; then echo "✅ 片账本已推送（第 $i 次）"; exit 0; fi
            sleep $((i*3 + RANDOM % 4))
          done
          echo "❌ 片账本推送失败"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: led-${{ inputs.stage }}-${{ matrix.shard }}
          path: |
            collect/ledger/${{ inputs.stage }}_shard*.json
            collect/ledger/*_shard${{ matrix.shard }}.json
          retention-days: 30
          if-no-files-found: warn

  merge:
    needs: [plan, shard]
    if: always() && inputs.rebuild_ledger != '1' && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install --quiet pyyaml
      - name: 取各片账本 + 计划（git 优先，artifact 兜底；缺片不致命）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F="collect/ledger/${{ inputs.stage }}_plan.json"
          # 片账本各片已 git 推到 main；egress 限流时 artifact 根本拉不下来，走 git 才可靠
          for i in 1 2 3 4; do
            git fetch -q origin main || true
            git checkout -q origin/main -- collect/ledger 2>/dev/null && break
            sleep $((i * 4))
          done
          if [ ! -s "$F" ]; then
            for i in 1 2 3; do
              gh run download "$GITHUB_RUN_ID" -n "plan-${{ inputs.stage }}" -D collect/ledger && break
              echo "⚠️ 计划 artifact 第 $i 次失败"; sleep $((i * 5))
            done
          fi
          n=$(ls collect/ledger/${{ inputs.stage }}_shard*.json 2>/dev/null | wc -l)
          echo "从 git 取到 $n 个片账本"
          if [ "$n" = "0" ]; then
            for i in 1 2 3; do
              gh run download "$GITHUB_RUN_ID" -D collect/ledger -p "led-*" && break
              echo "⚠️ 片账本 artifact 第 $i 次失败"; sleep $((i * 5))
            done
          fi
          ls -la collect/ledger/ | head -20
      - name: 汇总账本 + 收官文档（有片被 cancel 也要出部分账本）
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          # step_full_report.py 遇到缺片/partial_run 片不会退出，只把它们记成
          # shards_incomplete 并写进文档「片完成度」节 —— 保证任何情况下都拿得到账。
          # ★ --run-id 必传：step_full_report 现在把本 run 结果写 collect/ledger/<stage>_run<RUN_ID>.json，
          #   阶段账本 collect/<stage>_ledger.json 只做按层合并（状态取更优者），
          #   小 run（层数 < 阶段账本的 1/2）默认不碰阶段账本 —— 见 collect/ledger_merge.py。
          python3 collect/step_full_report.py --stage "$STAGE" --run-id "$GITHUB_RUN_ID" \
            --plan "collect/ledger/${STAGE}_plan.json"
          # ★ 尝试账本（W33-037，2026-10-31）：每轮把 failed 记录**追加**进
          #   analysis/<stage>-attempt-log.json。不追加的话，片账本被下一轮覆盖后历史尝试就没了，
          #   「连续 3 次失败」永远凑不满，上游不稳的层就会一直留在待采队列里吃 CI。
          #   失败在这里只打 warning：账本已落，不因一次统计失败把 merge 判红。
          python3 collect/attempt_log.py --stage "$STAGE" \
            --out "analysis/${STAGE}-attempt-log.json" \
            || echo "::warning::尝试账本生成失败（不影响本轮账本落地，但下一轮重试上限会少记本轮的失败）"
          ls -la docs/ | tail -5
          ls -la collect/ledger/ | tail -10
      - name: 提交（账本 + 文档）
        id: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          # ★ 2026-10-30 run 41092912755 事故：merge 的账本生成成功了，但推送 6 次全败，
          #   因为工作区里全是采集产物（download-artifact 落下的片账本、collect/progress/*.json），
          #   `git rebase` 直接报 “cannot rebase: You have unstaged changes”（被 2>/dev/null 吞了），
          #   重试 6 次只是重复同一个错误 → 账本一行没落地。
          #   现在改成：产物先搬 /tmp → checkout -qf 硬对齐 origin/main → 搬回来 → 提交 → 推送。
          rm -rf /tmp/push && mkdir -p /tmp/push/ledger /tmp/push/docs /tmp/push/analysis
          cp -f "collect/${STAGE}_ledger.json" /tmp/push/ 2>/dev/null || true
          cp -f collect/ledger/*.json /tmp/push/ledger/ 2>/dev/null || true
          cp -f docs/*FULL-*.md /tmp/push/docs/ 2>/dev/null || true
          cp -f analysis/*-attempt-log.json /tmp/push/analysis/ 2>/dev/null || true
          for i in $(seq 1 6); do
            git fetch -q origin main || true
            git checkout -qf -B main origin/main
            mkdir -p collect/ledger docs analysis
            cp -f /tmp/push/${STAGE}_ledger.json collect/ 2>/dev/null || true
            cp -f /tmp/push/ledger/*.json collect/ledger/ 2>/dev/null || true
            cp -f /tmp/push/docs/*FULL-*.md docs/ 2>/dev/null || true
            cp -f /tmp/push/analysis/*-attempt-log.json analysis/ 2>/dev/null || true
            git add -f "collect/${STAGE}_ledger.json" collect/ledger docs analysis/*-attempt-log.json 2>/dev/null || true
            if git diff --cached --quiet; then echo "无变化（账本已在 main）"; exit 0; fi
            git -c user.name=collect-bot -c user.email=bot@users.noreply.github.com \
                commit -q -m "collect: ${STAGE} 全量收官账本 + 文档"
            if git push -q origin HEAD:main; then
              echo "✅ 已推送（第 $i 次）"; echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "⚠️ push 第 $i 次被拒，重试…"; sleep $((i*3 + RANDOM % 4))
          done
          echo "::error::账本推送失败（6 次）—— 账本未上 main，需人工补"
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ inputs.stage }}
          path: |
            docs/*FULL-*.md
            docs/STEP0*-FULL-*.md
            collect/${{ inputs.stage }}_ledger.json
            collect/ledger
          retention-days: 30
      # ★ 接续闸门（2026-10-30 立规）：只要还有「未完成片」或 failed 层，禁止自动接下一阶段。
      #   闸门本身不改 job 结论 —— 账本必须先落地，红的是「不许接续」这件事，不是 merge。
      - name: 判定 + 自动接续下一阶段（闸门：未完成片 / failed 层一律不接续）
        id: chain
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}   # ★ 必须在这里注入：脚本里读 os.environ["STAGE"]，
                                       #   只在 shell 里赋值不导出会 KeyError（41092912755 就是这么红的）
        run: |
          set -euo pipefail
          STAGE="${{ inputs.stage }}"
          # ★ 接续策略的唯一真值在 collect/chain_policy.py（带单测）：
          #   04b→05b→07b，**07b 之后为空**；允许清单只放 05b/07b；子 run 一律 chain=0。
          #   这里不再写 case 表，也不再硬编码 -f chain=1（那是 07b 会派出 10b 的根因）。
          python3 collect/chain_policy.py --stage "$STAGE" --chain "${{ inputs.chain }}" \
            --write-env /tmp/chain.env
          . /tmp/chain.env   # CHAIN_DECIDE / CHAIN_NEXT / CHAIN_CHILD_CHAIN / CHAIN_REASON
          LED="collect/${STAGE}_ledger.json"
          if [ ! -f "$LED" ]; then
            echo "::error::$STAGE 没有汇总账本（$LED）→ 不接续，请查 merge 日志"
            exit 1
          fi
          python3 - <<'PY' > /tmp/verdict.txt
          import json,os
          d=json.load(open("collect/%s_ledger.json"%os.environ["STAGE"]))
          inc=d.get("shards_incomplete") or []
          print(d["failed"], d["partial"], d["layers_n"], d["ok"], d["empty"],
                d.get("skipped_done",0), len(inc), ",".join(str(x) for x in inc) or "-",
                d.get("shards_expected"), d.get("shards_reported"), int(bool(d.get("complete"))))
          PY
          read FAILED PARTIAL N OK EMPTY SKIP INC INCLIST NEXP NREP COMPLETE < /tmp/verdict.txt
          echo "failed=$FAILED partial=$PARTIAL layers=$N ok=$OK empty=$EMPTY skipped=$SKIP incomplete_shards=$INC($INCLIST)"
          { echo "### $STAGE 判定";
            echo "- 层 $N / ok $OK / empty $EMPTY / partial $PARTIAL / failed $FAILED / skipped $SKIP";
            echo "- 片：应有 $NEXP / 有账本 $NREP / **未完成 $INC**（片号 $INCLIST）";
            [ "$INC" = "0" ] || echo "- ⛔ 未完成片存在 → 禁止自动接续 ${CHAIN_NEXT:-（无下一阶段）}";
            echo "- 接续策略：decide=$CHAIN_DECIDE reason=$CHAIN_REASON next=${CHAIN_NEXT:-（无）} 子 run chain=$CHAIN_CHILD_CHAIN";
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$INC" != "0" ]; then
            echo "::error::$STAGE 有 $INC 片未完成（片号 $INCLIST，账本 shards_incomplete）→ 禁止接续 ${CHAIN_NEXT:-（无）}；先 force_layers 补跑"
            exit 0
          fi
          if [ "$FAILED" != "0" ]; then
            echo "::error::$STAGE 有 $FAILED 层 failed → 禁止接续 ${CHAIN_NEXT:-（无）}（账本已落，逐条原因见 docs）"
            exit 0
          fi
          if [ "$COMPLETE" != "1" ]; then
            echo "::error::$STAGE 账本 complete=false（片齐、failed=0，但仍有 partial/未完成标记）→ 禁止接续 ${CHAIN_NEXT:-（无）}"
            exit 0
          fi
          if [ "$CHAIN_DECIDE" != "dispatch" ]; then
            echo "本阶段收敛（片齐 + failed=0），不接续（chain=${{ inputs.chain }}，reason=$CHAIN_REASON，next=${CHAIN_NEXT:-无}）"
            exit 0
          fi
          echo "✅ $STAGE 全绿 → 接续 $CHAIN_NEXT（子 run chain=$CHAIN_CHILD_CHAIN，单跳不级联）"
          gh workflow run collect-full.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f stage="$CHAIN_NEXT" -f chain="$CHAIN_CHILD_CHAIN" -f workers=4

  # ===================================================================
  # 账本重建（手动入口：rebuild_ledger=1）。
  # 不采数据，只读 Release 资产：tag → checkpoint（unit_rows/unit_rows_seen/
  # unit_uploaded/done_units/unit_errors）→ -uNNNNN.tar.gz 是否真存在。
  # 任一环对不上判 failed，不估算。输出 collect/ledger/step<NN>b_rebuilt.json
  # + docs/STEP<NN>-FULL-<date>.md，脚本幂等（--check 可验证字节一致）。
  # ===================================================================
  rebuild:
    if: inputs.rebuild_ledger == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 取计划清单（plan-<stage> 产物 / 现算兜底）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}
          RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          mkdir -p collect/ledger
          if [ -n "${RUN_ID}" ] && gh run download "${RUN_ID}" --repo "$GITHUB_REPOSITORY" \
               -n "plan-${STAGE}" -D collect/ledger 2>/dev/null; then
            echo "✅ 计划来自 run ${RUN_ID}"
          else
            echo "::warning::没拿到 plan-${STAGE} 产物，按当前 steps.json 现算（层集合可能与原 run 不同）"
            python3 collect/full_plan.py --stage "$STAGE" --size 0 \
              --out "collect/ledger/${STAGE}_plan.json" || true
          fi
          ls -la collect/ledger/*_plan.json || true
      - name: 重建账本
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}
          RUN_ID: ${{ inputs.plan_run_id }}
        run: |
          set -euo pipefail
          # RUN_ID = 那次采采的 run，用来把「片 → 结论」标进账本（cancelled 片必须留痕）
          RID=""; [ -n "${RUN_ID}" ] && RID="--run-id ${RUN_ID}"
          python3 collect/ledger_rebuild.py --stage "$STAGE" \
            --plan "collect/ledger/${STAGE}_plan.json" $RID \
            --out "collect/ledger/step${STAGE}_rebuilt.json" --jobs 8
          # 幂等自证：同状态再跑一次必须 IDENTICAL（scan_meta 已排除）
          python3 collect/ledger_rebuild.py --stage "$STAGE" \
            --plan "collect/ledger/${STAGE}_plan.json" $RID \
            --out "collect/ledger/step${STAGE}_rebuilt.json" --check
          { echo "### ${STAGE} 账本重建"; echo '```'
            python3 -c "import json;d=json.load(open('collect/ledger/step${STAGE}_rebuilt.json'));print({k:d[k] for k in ('layers_n','ok','empty','partial','failed','declared','rows','gap','gap_pct','assets_total','bytes_total')})"
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 提交账本 + 文档
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          git config user.name  "collect-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f "collect/ledger/step${STAGE}_rebuilt.json"
          for f in docs/STEP*-FULL-*.md; do [ -f "$f" ] && git add -f "$f"; done
          if git diff --cached --quiet; then echo "无变化（幂等：账本已是最新）"; exit 0; fi
          git commit -q -m "collect: ${STAGE} 账本从 Release 资产重建（含 >1% 差额逐层说明）"
          for i in $(seq 1 6); do
            git fetch -q origin main || true
            if git rebase -q origin/main 2>/dev/null && git push -q origin HEAD:main; then
              echo "✅ 已推送 $(git rev-parse --short HEAD)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i*3 + RANDOM % 4))
          done
          echo "::error::账本推送失败"; exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rebuilt-${{ inputs.stage }}
          path: |
            collect/ledger/step${{ inputs.stage }}_rebuilt.json
            docs/STEP*-FULL-*.md
          retention-days: 90
