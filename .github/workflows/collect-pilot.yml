name: collect-pilot
# STEP 02 工人：只干活，不报警。验收由工头（collect-supervisor）判。
# 数据直接进 Release（每层独立 tag，避免并发抢同一个 release），artifact 只带报告。
on:
  workflow_dispatch:
    inputs:
      layers:
        description: "只跑这几层（逗号分隔，留空=全部 8 层）"
        default: ""
      workers:
        description: "每层内部并发线程数（1=不并发）"
        default: "4"
      unit_rows:
        description: "一个采集单元的目标行数；单元完成即打包发布一次（断点续传粒度）"
        default: "500000"
permissions:
  contents: write
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      empty: ${{ steps.gen.outputs.empty }}
    steps:
      - id: gen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          raw = os.environ.get("LAYERS", "").strip()
          all8 = ["ks911", "az911", "nysam", "me_addr", "de_suss", "yngstown", "boco_addr", "san_juan"]
          layers = [x.strip() for x in raw.split(",") if x.strip()] or all8
          print("matrix=" + json.dumps({"include": [{"layer": x} for x in layers]}))
          print("empty=" + ("1" if not layers else "0"))
          PY
        env:
          LAYERS: ${{ github.event.inputs.layers }}
  collect:
    needs: plan
    if: needs.plan.outputs.empty != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 采集 ${{ matrix.layer }}（单元级断点续传）
        env:
          PILOT_HEARTBEAT_PUSH: "1"
          # ★ tag 按层固定，不带 run_number —— 这样下一轮 run 能从这个 tag 里
          #   把 <layer>-checkpoint.json 捞回来，接着上次的进度跑，而不是从 0 开始。
          #   tag 内的资产：<layer>-u00001.tar.gz（每单元一个）+ <layer>-checkpoint.json
          PILOT_RELEASE_TAG: collect-pilot-${{ matrix.layer }}
        run: |
          python3 collect/run_step_02.py --layer ${{ matrix.layer }} \
            --workers ${{ github.event.inputs.workers || '4' }} \
            --unit-rows ${{ github.event.inputs.unit_rows || '500000' }}
      - name: 兜底上传（只有 pilot 一个单元都没发成功时才做）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ matrix.layer }}
        run: |
          # pilot.py 自己是发布者：每个单元完成 → 立刻 tar + gh release upload（--clobber）
          # 这里只在「它一次都没发成功」时兜底，避免同一份数据重复传两遍。
          TAG="collect-pilot-$ID"
          export ID   # 给下面 python -c 读（env: 里的 ID 已注入，这行是双保险）
          N=$(python3 -c "import json,os;p='collect/out/%s/_checkpoint.json'%os.environ['ID'];print(len(json.load(open(p)).get('done_units') or []) if os.path.exists(p) else 0)")
          if [ "${N:-0}" -gt 0 ]; then
            echo "✅ pilot 已分批发 ${N} 个单元到 $TAG，跳过兜底上传"
            exit 0
          fi
          if [ -d "collect/out/$ID" ] && [ -n "$(ls -A "collect/out/$ID" 2>/dev/null)" ]; then
            tar czf "/tmp/$ID.tar.gz" -C collect/out "$ID"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "试点 $ID #${{ github.run_number }}" --notes "fallback full payload" "/tmp/$ID.tar.gz" \
              || gh release upload "$TAG" "/tmp/$ID.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber \
              || { echo "❌ $ID 数据没进 Release，这层等于白跑"; exit 1; }
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-${{ matrix.layer }}
          path: collect/reports/${{ matrix.layer }}.json
          if-no-files-found: warn
          retention-days: 14
  report:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ★ fetch-depth: 0 —— 2026-10-24 确诊：默认浅克隆下 git rebase 无法重放，
      #   push 5 次全被拒、报告静默丢失（老代码 || true 又把它吞了）。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          path: collect/reports
          pattern: "rep-*"
          merge-multiple: true
      - name: 汇总
        run: python3 collect/make_pilot_report.py
      - name: 提交试点报告（工头据此判验收）
        # ★ 2026-10-23 事故：这里原本是 `git push || true`，撞上工头同时推 collect/state.json
        #   时 non-fast-forward 被拒，报告静默丢失 → 工头读到上一轮旧报告 → 误判「未通过」
        #   → 连败 3 次熔断收摊（实际 8 层全采集成功）。改成 rebase 重试 + 失败显式报错。
        run: |
          git config user.name collect-bot
          git config user.email bot@users.noreply.github.com
          git add -f collect/pilot_report.json
          git diff --cached --quiet || git commit -m "collect: STEP02 试点报告"
          ok=0
          for i in 1 2 3 4 5; do
            git fetch -q origin main || true
            git rebase -q origin/main 2>/dev/null || git rebase --abort 2>/dev/null || true
            if git push -q origin HEAD:main 2>/dev/null; then ok=1; echo "✅ 报告已推送（第 $i 次尝试）"; break; fi
            echo "⚠️ push 第 $i 次被拒，重试…"; sleep $((i*4))
          done
          if [ "$ok" = "0" ]; then
            echo "❌ 报告推送失败：工头会读到旧报告而误判，必须人工介入"; exit 1
          fi
