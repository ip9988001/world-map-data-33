name: collect-batch
# STEP 03/04/05 通用工人：动态生成 matrix，一个 job 搬一个图层
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "state | statewide | bulk"
        default: "state"
      state:
        description: "州代码（mode=state 时用）"
        default: "KS"
      offset:
        description: "bulk 起始偏移"
        default: "0"
      size:
        description: "bulk 每批层数"
        default: "40"
permissions:
  contents: write
concurrency:
  group: collect-batch-${{ github.event.inputs.mode }}-${{ github.event.inputs.state }}-${{ github.event.inputs.offset }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: gen
        name: 生成 matrix
        run: |
          set -e
          python3 collect/batch.py --mode "${{ github.event.inputs.mode }}" \
            --state "${{ github.event.inputs.state }}" \
            --offset "${{ github.event.inputs.offset }}" \
            --size "${{ github.event.inputs.size }}" --list-matrix > /tmp/raw.json
          python3 -c "import json;d=json.load(open('/tmp/raw.json'))[:40];print(json.dumps({'include':d}))" > /tmp/m.json
          python3 -c "import json;print(len(json.load(open('/tmp/m.json'))['include']))" > /tmp/count.txt
          {
            echo "matrix=$(cat /tmp/m.json)"
            echo "count=$(cat /tmp/count.txt)"
          } >> "$GITHUB_OUTPUT"
  collect:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 搬 ${{ matrix.id }}
        env:
          CFG: ${{ toJson(matrix) }}
        run: |
          python3 -c "import json,os;open('collect/pilot_layers.json','w').write(json.dumps([json.loads(os.environ['CFG'])]))"
          LID=$(python3 -c "import json;print(json.load(open('collect/pilot_layers.json'))[0]['id'])")
          python3 collect/pilot.py --layer "$LID"
      - name: 打包上传 Release（数据不走 artifact）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="collect-${{ github.event.inputs.mode }}-${{ github.event.inputs.state }}-${{ github.run_number }}"
          for d in collect/out/*/; do
            [ -d "$d" ] || continue
            N=$(basename "$d")
            tar czf "/tmp/$N.tar.gz" -C collect/out "$N" || true
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "采集 $TAG" --notes "mode=${{ github.event.inputs.mode }}"
            gh release upload "$TAG" "/tmp/$N.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-${{ matrix.id }}
          path: collect/reports/
          retention-days: 14
