# 引擎方言扩展表（registry 之外的源族）
#
# 解析顺序（engine/inlet.py: resolve_dialect）：
#   1) registry/dialects.v1.yaml（第 4 步产物，冻结只读）—— 命中就用注册表口径
#   2) engine/dialects/*.yaml（本表）—— 源族自带的方言定义
#   3) 都没有 → 显式 unsupported，落清单，不猜
#
# 字段映射写法：`canonical: [候选字段名, ...]`，按顺序取第一个非空值；
# 归一（大小写/标点/缩写/方向词/单元号）在 engine/outlet_clean.py，不在这里做。
schema: engine-dialect.v1/2026-11-25
dialects:
  - id: nad-v1
    family: nad
    adapter: ndjson
    crs: EPSG:4326
    precision: address_point
    geom_type: point
    fields:
      number: [Add_Number, AddNo_Full]
      number_suffix: [AddNum_Suf]
      pre_dir: [St_PreDir]
      street: [StNam_Full, St_Name]
      post_type: [St_PosTyp]
      post_dir: [St_PosDir]
      unit: [Unit, SubAddress]
      city: [Post_City, Inc_Muni]
      state: [State]
      zip: [Zip_Code]
      lon: [Longitude, _lon]
      lat: [Latitude, _lat]
      id: [UUID, OBJECTID]
  - id: oa-v1
    family: oa
    adapter: zip_csv
    crs: EPSG:4326
    precision: address_point
    geom_type: point
    fields:
      number: [NUMBER]
      street: [STREET]
      unit: [UNIT]
      city: [CITY]
      state: [REGION]
      zip: [POSTCODE]
      lon: [LON]
      lat: [LAT]
      id: [ID, HASH]
  - id: tiger-addrfeat-v1
    family: tiger
    adapter: zip_shp
    crs: EPSG:4269
    precision: street_range          # 只有街段+门牌区间，没有点；不给坐标，不插值
    geom_type: none
    fields:
      street: [FULLNAME]
      post_type: []
      state: []
      from_hn: [LFROMHN]
      to_hn: [LTOHN]
      id: [TLID]
    range_only: true
  - id: tiger-interp-v1
    family: tiger
    adapter: ndjson
    crs: EPSG:4326
    precision: range_interpolation   # 上游已插值，坐标是插出来的，标记 is_interpolated
    geom_type: point
    is_interpolated: true
    fields:
      number: [number]
      street: [street]
      unit: [unit]
      state: [source_state]
      zip: [postcode]
      lon: [lon]
      lat: [lat]
      id: [tlid]
  - id: granit-parcel-v1
    family: granit
    adapter: ndjson
    crs: EPSG:4326
    precision: parcel_centroid      # 地块质心（不是门牌点），按 manifest 声明
    geom_type: point
    fields:
      combined: [streetaddress]     # "58 BARBARA DRIVE" → 门牌 + 街名，由 outlet_clean.split_combined 解析
      state: [source_state]
      city: [town]
      lon: [_lon]
      lat: [_lat]
      id: [u_id, parceloid]
  - id: overture-v1
    family: overture
    adapter: parquet
    crs: EPSG:4326
    precision: address_point
    geom_type: point               # 兜底声明；实际按 WKB 几何类型（点取自身、面线取真实顶点）
    fields:
      number: [number]
      street: [street]
      unit: [unit]
      city: [postal_city]
      zip: [postcode]
      lon: []                      # 坐标在 geometry(WKB) 里，由 inlet 解出
      lat: []
      id: [id]
    state_from: address_levels     # list<struct<value>>，第一个元素是州
    geometry: wkb_any              # 面/线不许当质心：取 rings[0][0] / paths[0][0] 真实顶点
  - id: engine-dialect-samples-v1
    family: dialect_layer
    adapter: samples_csv
    crs: EPSG:4326
    precision: mixed               # 逐行取采样时的 geom_type
    geom_type: unknown             # 行级实测优先（样本自带 geom_type）
    fields:
      number: [house_number]
      street: [street_full, street_name]
      unit: [unit]
      city: [postal_city]
      state: [state_abbr]
      zip: [zip5]
      lon: [lon]
      lat: [lat]
      id: [layer_id]

  # ---- 组合拳②（2026-11-25）：Tier1 缺口 P7 组（321 层）的门牌列 / 街名列字段名 ----
  # 来源：analysis/combo-step2-20261125/（patterns.csv 的 P7 321 层 → 逐层行级共同成立校验 → 去重 → 逐别名回归筛查）
  # 说明：这批层是任意 ArcGIS 图层，不属于任何源族；本条目只作「别名来源」，不带几何/精度声明。
  # 边界 1（语义）：只收明确是门牌列 / 街名列的字段名；OWN_*/MAIL_*/整串地址列不进（见 pending-uncertain.csv）。
  # 边界 2（回归）：逐别名在 coord-samples 695,706 条非 P7 行上单测 —— 27 条候选零键丢失；
  #                Muse 2026-11-25 拍板（b 路）：registry 是分档唯一真源，旧键「同语义更完整列名替换」
  #                按 improved/questionable 逐层审计（见 analysis/combo-step2-close-20261125/old-key-changes.csv）。
  # 生效范围：本条目是「别名来源」，由 analysis/dialect-20261124/gen_registry.py 合并进
  #           registry/dialects.v1.yaml（id=alias-ext-p7-v1），E7 的 roles_of() 从 registry 取并集即吃到。
  #           27 条：19 门牌 + 8 街名（去重后恰好 27，两边逐条一致）。
  - id: p7-alias-ext-v1
    family: alias_extension
    adapter: none                  # 只提供别名，不做适配
    precision: unknown
    geom_type: unknown
    fields:
      number: [ADDRNUM_1, ADDR_NUMB, ADDR_STR_NBR, ANUMBER, Addr_Number, AddressNum, GM_HSE_NUM,
               HOUSE_NO, HOUSE_NUMB, HSE_NUM, HSE_NUMB, House, HouseNumbe, HouseNumber,
               PROPERTYHOUSENUM2, SA_House_N, STREETNO, STREETNUMBER1, addr_numbe]   # 19
      street: [CC_ST_NAME, Loc_Street, PWA_FULLSTREET, SA_Street_, STREETALL, ST_NAME_COMPLETE,
               Street_Road_Name, situs_street]                                       # 8
