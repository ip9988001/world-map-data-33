# 空间验算阈值（第 5 步 · sandbox/spatial_verify.py 唯一读数入口）
# 每条都写：数值 / 取值理由 / 数据来源。改数值只改本文件，代码里不许出现魔法数。
schema: spatial-thresholds.v1/2026-11-24
source_of_geometry: analysis/tiger_county/*.json.gz（TIGERweb State_County/1，fetched_at 2026-10-30，51 州 3.0MB）

fuse:                                  # 绝对熔断红线：命中即该层立即降 Tier 3
  max_outside_share:
    value: 0.10
    why: 同一层里越界行占比 >10% 时，最可能是「声明的 county/state 错了」而不是个别坐标脏；地址点的越界率经验上应是 0，留 10% 容差给县界裁剪误差与飞地。
    source: 无外部标定数据；本仓库首次设定，冷启动值，待第 6 步用真实样本重标。
  max_cross_boundary_dist_m:
    value: 5000.0
    why: 只对「落在声明县界外」的行量距——越界 5km 以上已超出县界裁剪/坐标精度可解释范围（TIGER 县界与地址点口径差通常数百米内）。县内点的『到边界距离』不参与熔断，只进 P95 相对判据。
    source: TIGER 县界顶点精度 ~1e-4 度（约 11m）；5km = 该精度的 450 倍，足以排除精度因素。
  max_top_point_share:
    value: 0.50
    why: 超过半数行共用同一坐标 = 整层坐标被「单点填充」（常见于未经地理编码的占位质心），该层空间证据不可用。
    source: 本仓库 sandbox/fixtures 三份真实样本实测 top_point_share 均 ≤0.04（25 行 25 个唯一坐标），0.50 留足余量。
  min_unique_coord_rate:
    value: 0.05
    why: 坐标唯一率 <5% 与上一条同源（聚集），两条一起把「伪坐标层」钉死。
    source: 同上，fixtures 实测唯一率 = 1.0。
  min_sample_rows:
    value: 3
    why: 层内有效坐标 <3 行时不判熔断、也不判绿——记 unavailable，避免用 1~2 行结论推翻整层。
    source: 统计最小可判样本；与本轮「只跑抽样」口径一致。

p95:                                   # 层内相对异常（不与红线混用）
  boundary_dist_mult:
    value: 3.0
    why: 层内 P95 边界距离的 3 倍作为相对异常线，抓「同层里少数点飘得很远」，与绝对红线互补。
    source: 无外部标定；冷启动值，随样本积累重标。

unavailable:                           # 明确标注「未跑」的项（不许用占位值糊过去）
  building_outline_distance: 仓库内无建筑轮廓数据源（无 building footprint 图层）；只实现函数接口与单测，全量算距离标 unavailable。
  zip_zcta_table: 仓库内无 ZCTA/邮编表；本轮**未接入**（代码里没有 zip-table 参数，不许写成已实现），注册表层的邮编交叉校验一律记 unavailable，留第 6 步先定数据来源再做。

e7:                                    # E7 源间同址投票（sandbox/coord_evidence.py）
  max_addr_conflict_m:
    value: 300.0
    why: 同一个「门牌+街名(+邮编)」在两个不同源里给出 >300m 的坐标，已超出地址点采集/投影误差（同址不同源通常差数十米内）；300m 约为一个城市街区的量级。
    source: 无外部标定；本仓库首次设定，冷启动值。地址点与地块质心混用时会自然冲突，这正是要抓的。
  max_conflict_share:
    value: 0.10
    why: 同址行里 >10% 跨源冲突即判该层 E7 命中；留 10% 容差给「地址同号但门牌号重号」「街名缩写不同」这类键归一化误差。
    source: 与 fuse.max_outside_share 同一套容差逻辑（个别脏行不否定整层）。
  min_cmp_rows:
    value: 3
    why: 跨源同址可比行 <3 时不投票（投不出票就记 unknown，不写 clear 冒充「无冲突」）。
    source: 与 fuse.min_sample_rows 一致的最小可判样本。
  denominator_excluded:                # 可验分母剔除（只改分母，不动数据；第 9 步 2026-11-25）
    P8:
      value: 22
      why: 路段门牌区间（from/to addr + 街名、中心线层）。一条记录覆盖 100-198 这样的整段，**造不出单个门牌号键**，E7 的「同址投票」对它不适用；补采也改变不了这一点，故从可验分母剔除，判归因「数据性质如此，不是缺陷」。
      source: analysis/combo-step1-20261125/patterns.csv pattern_id=P8（逐层清单 analysis/grading-rerun-20261125/denominator-excluded.csv）
    P6:
      value: 90
      why: 结构 ID / 地块 ID / 分区号冒充地址（OBJECTID、PID、Zone 之类根本不是地址）。全层没有任何门牌+街名字段，E7 无从投票。
      source: 同上 pattern_id=P6
    P9:
      value: 66
      why: 只有街名（或街名+城市分列），全层无门牌列。缺「门牌号」这一半，键必然构不出；这是数据发布方的粒度选择，不是采集缺陷。
      source: 同上 pattern_id=P9
    P11:
      value: 9
      why: PO BOX / POST OFFICE BOX 邮政信箱。信箱号不是街道地址，无法与地址点同址比对。
      source: 同上 pattern_id=P11
    P12:
      value: 11
      why: 打码/占位门牌或路口名（3XX E 12TH ST、A ST / B AVE）。门牌被抹掉或本来就没有，判据不成立。
      source: 同上 pattern_id=P12
    total:
      value: 198
      why: 五类合计（P8 22 + P6/P9/P11/P12 176）。剔除只作用于「E7 可验分母」，层仍留在 17,168 行分母里、三档照样给，只是不再拿 E7 的可验性去扣它们。
      source: 上述五条之和；断言由 analysis/grading-rerun-20261125/reconcile.py 校验

e7_refpool:                            # E7 扩参照源（sandbox/e7_refpool.py）· 每层取前 N 行，绝不当全量
  per_layer_cap:
    value: 2000
    why: 本地全表 1,158 个层目录 / 13.5GB（gz），全量读入需 1 小时以上且内存不可控；每层按文件顺序取前 2,000 行作参照池上限。这是**采样**，不是全量：实际取到的行数、被截断的层、跳过的层全部逐层落进 e7-refpool-stats.csv。
    source: sandbox/e7_refpool.py 实测 1,158 层 × 2,000 上限 = 1,242,772 行（多数层不足 2,000 行），25.7 秒。
  max_cmp_per_row:
    value: 200
    why: 同一地址键在参照池里可能有成百上千行（公寓同号），逐个算球面距离会把复杂度推到 O(n²)。每个自身行只对同键他源行按固定顺序取前 200 行算最小距离；这是距离比较的上限，不影响「同址跨源 >300m 记冲突」这条判据本身。
    source: 本仓库实测：键桶超过 200 行的占全部键桶 0.4%，截断只影响极端同号聚集场景。

e3_relax:                              # E3 口径开关（sandbox/tier_relax.py）
  default:
    value: "off"
    why: 默认严格口径（粒度未定 → unknown → 直接 Tier3），保证 --e3-relax off 能原样复现第 5 步的 30 层；只有显式 --e3-relax on 才把「粒度未定但坐标样本有实测几何类型」记 na（与 E8「无模板即 na」同理）。
    source: muse-000226 拍板；敏感性依据见 analysis/auto-spatial-rerun-20261125/REPORT.md §8。
