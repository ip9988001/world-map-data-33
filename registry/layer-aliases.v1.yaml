# 层级别名（layer-scoped aliases）v1 —— muse-000271 / fix58 修 3
#
# 为什么要有这一层：REPORT-unmapped.md §4.3 的 6 层地址在**字段名过泛**的列里
# （NAME / TYPE / STR / PARCEL_LOC / LST_CONCAT / Street_derived）。这类列名放进
# registry/dialects.v1.yaml 的全局角色表会误伤（NAME 可能是人名、场所名、业主名），
# 所以只按 **层**（url 或 layer_id 精确匹配）生效，全局最小安全表一条都不加。
#
# 语义（实现见 analysis/fieldmap-20261125/fm_core.py:LayerMapper.map_row）：
#   street_fields  只在本行 **没有原生街名**、且全局角色表也没取到街名时才用；
#                  按**声明顺序**拼接（不做长度排序），占位值跳过。
#   number_fields  同理，只在门牌为空时按声明顺序取第一个非空。
#   split_fields   组合串候选键的**优先序**（排在全字段之前）；用于「整串地址」列。
#   drop_values    该层专属占位值（大小写不敏感，整值匹配），只作用于 split_fields。
# 不改任何分级口径（grade_of / cap_no_zip 不动），也不改全局角色表。
schema: layer-aliases.v1/2026-11-26
basis: analysis/fieldmap-20261125/unmapped-20261126/REPORT-unmapped.md §4.3 表 + §5 #6 #11 #29 #32 #36 #49
